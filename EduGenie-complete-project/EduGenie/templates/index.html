<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">AI LEARNING ASSISTANT</p>
        <h1>EduGenie</h1>
        <p class="subtitle">
          Learn with AI through Q&A, simple explanations, quizzes,
          summaries and personalized learning paths.
        </p>
      </div>
      <div class="status" id="status">Checking backend…</div>
    </header>

    <section class="card">
      <label for="task">Choose a learning task</label>
      <select id="task">
        <option value="qa">Q&amp;A</option>
        <option value="explain">Explain</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize</option>
        <option value="learn">Recommend Learning Path</option>
      </select>

      <label for="inputText">Enter your question, topic or text</label>
      <textarea id="inputText" rows="10"
        placeholder="Example: Explain the Pythagoras theorem in simple language."></textarea>

      <div class="quiz-controls" id="quizControls">
        <label for="count">Quiz questions</label>
        <input id="count" type="number" min="1" max="10" value="3">
      </div>

      <button id="submitBtn">Generate Result</button>
    </section>

    <section class="card result-card">
      <div class="result-header">
        <h2>Result</h2>
        <button class="secondary" id="copyBtn" type="button">Copy</button>
      </div>
      <div id="loading" class="loading hidden">Thinking…</div>
      <div id="result" class="result">Your AI result will appear here.</div>
    </section>

    <footer>
      <span>EduGenie • FastAPI + Google Gemini + LaMini-Flan-T5</span>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
